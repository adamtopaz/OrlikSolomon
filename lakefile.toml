name = "OrlikSolomon"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["OrlikSolomon"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

# We track the most recent Mathlib; `lake-manifest.json` pins the exact commit.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "master"

# Must stay on the same Lean toolchain as Mathlib `master`.
[[require]]
name = "verso"
git = "https://github.com/leanprover/verso"
rev = "v4.36.0-rc2"

# The audit behind `scripts/check.sh` and `scripts/replay.sh`. It reads the built library at run
# time, so neither depends on the other.
[[lean_exe]]
name = "audit"
root = "Audit"
srcDir = "scripts"

# The formalization: a library that does not depend on Verso.
[[lean_lib]]
name = "OrlikSolomon"

[lean_lib.leanOptions]
weak.linter.mathlibStandardSet = true

# The exposition: a Verso book tied to the code. Only `lake build OrlikSolomonBook` and
# `lake exe book` compile Verso, and the default target above never does.
[[lean_lib]]
name = "OrlikSolomonBook"
# The book reads the blueprint's labels while it is elaborated.
needs = ["blueprintSource"]

[[input_dir]]
name = "blueprintSource"
path = "blueprint"
text = true

[[lean_exe]]
name = "book"
root = "OrlikSolomonBook.Main"
