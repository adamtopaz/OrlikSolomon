name: Book

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on a pull request replaces an older build, but a deployment is left to finish.
concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Installs Lean and fetches Mathlib's build from its own cache. The action's GitHub cache stays
      # off, as in the `CI` workflow, because it would save all of `.lake` for every commit.
      - uses: leanprover/lean-action@v1
        with:
          auto-config: "false"
          use-github-cache: "false"
          use-mathlib-cache: "true"

      # This has to come after the step above, which clones the packages. Mathlib's build comes from
      # its own cache, so only the native objects that the executable links against are kept here.
      # They are about 250 MB, so only `main` saves them: a pull request restores the latest build
      # from `main` and builds what it changed.
      - id: restore
        uses: actions/cache/restore@v6
        with:
          path: |
            .lake/build
            .lake/packages/*/.lake/build
            !.lake/packages/mathlib/.lake/build
            .lake/packages/mathlib/.lake/build/ir/**/*.c.o.*
          key: book-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: book-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Build the book
        run: lake build OrlikSolomonBook book

      - uses: actions/cache/save@v6
        if: github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true'
        with:
          path: |
            .lake/build
            .lake/packages/*/.lake/build
            !.lake/packages/mathlib/.lake/build
            .lake/packages/mathlib/.lake/build/ir/**/*.c.o.*
          key: ${{ steps.restore.outputs.cache-primary-key }}

      - name: Render the book and check that it covers the blueprint
        run: lake exe book --output _out/book

      - name: Check the generated pages
        run: node scripts/check-book-output.mjs _out/book/html-multi

      # Uploading on pull requests too verifies the artifact before anything can be deployed.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _out/book/html-multi

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
